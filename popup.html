<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超星助手</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <main id="view-home" class="view home-view">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="plugin-title">Fk-Chaoxing <span class="version">v1.2.4</span></h1>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-refresh" title="重载插件" style="margin-right: 4px;">
          <i class="ri-refresh-line"></i>
        </button>
        <label class="switch" title="临时关闭/开启插件">
          <input type="checkbox" id="plugin-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <!-- Current Page Info -->
    <section class="page-info">
      <img id="page-favicon" src="icons/chaoxing.png" alt="icon" class="favicon">
      <div class="page-details">
        <div id="page-title" class="page-title">检测中...</div>
        <div id="page-url" class="page-url">--</div>
      </div>
    </section>

    <div class="divider"></div>

    <!-- Extractors -->
    <section class="section">
      <h2 class="section-title">提取题目</h2>
      <button class="btn btn-outline" id="btn-extract-auto" title="自动识别页面类型并提取题目">
        <i class="ri-clipboard-line"></i> 提取本页题目
      </button>
    </section>

    <!-- AI Answer -->
    <section class="section">
      <div class="section-header-row">
        <h2 class="section-title">辅助</h2>
        <button class="btn-text" id="btn-ai-config-open" type="button" title="打开设置">
          <i class="ri-settings-3-line"></i> 配置
        </button>
      </div>
      <div class="form-group quick-reasoning">
        <label for="ai-quick-reasoning">本次思考等级</label>
        <select id="ai-quick-reasoning" class="form-control"><option value="">使用模型默认</option>
              <option value="none">不思考</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="xhigh">XHigh</option>
              <option value="max">Max</option></select>
        <p class="quick-reasoning-help">仅覆盖本次请求，结束后恢复配置默认等级。</p>
      </div>
      <div class="button-stack">
        <button class="btn btn-primary" id="btn-ai-answer">
          <img id="btn-ai-icon" src="" style="width: 14px; height: 14px; border-radius: 2px; display: none;" />
          <i class="ri-openai-fill" id="btn-ai-icon-default"></i>
          <span id="btn-ai-text">AI 答题</span>
        </button>
        <button class="btn btn-outline" id="btn-auto-apply-toggle">
          <span id="btn-auto-apply-text">自动作答：关闭</span>
        </button>
      </div>
    </section>

    <div class="divider"></div>

    <!-- Logs -->
    <section class="section log-section">
      <div class="log-header">
        <h2 class="section-title">运行日志</h2>
        <button id="btn-clear-log" class="btn-text">清空</button>
      </div>
      <div id="log-content" class="log-content">
        <div class="log-item info">
          <span class="log-msg">等待操作...</span>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://github.com/iPycc/Fk-Chaoxing-Extension" target="_blank" class="link">
        <i class="ri-github-fill"></i> GitHub
      </a>
      <a href="https://scriptcat.org/zh-CN/script-show-page/4386" target="_blank" class="link">
        ScriptCat
      </a>
    </footer>
    </main>

    <section id="view-settings" class="view settings-view" hidden aria-label="总体设置">
      <div class="settings-header">
        <button class="btn-icon settings-back" id="btn-settings-back" type="button" title="返回主界面" aria-label="返回主界面">←</button>
        <h2>总体设置</h2>
      </div>
      <div class="settings-content">
        <div class="settings-group">
          <div class="settings-group-heading"><h3>答题任务</h3></div>
          <div class="setting-field">
            <label for="ai-batch-size">每次请求题目数</label>
            <input id="ai-batch-size" class="form-control" type="number" min="1" max="100" step="1" inputmode="numeric">
            <p>题目按页面顺序拆分，每次请求独立答题。</p>
          </div>
          <div class="setting-field">
            <label for="ai-concurrency">同时并发数</label>
            <input id="ai-concurrency" class="form-control" type="number" min="1" max="16" step="1" inputmode="numeric">
            <p>更高的值会同时发出更多请求。</p>
          </div>
          <div class="setting-field">
            <label for="ai-max-retries">失败重试次数</label>
            <input id="ai-max-retries" class="form-control" type="number" min="0" max="5" step="1" inputmode="numeric">
            <p>0 表示不重试。</p>
          </div>
          <p id="batch-settings-error" class="field-error" role="alert" hidden></p>
          <button id="btn-batch-save" class="btn btn-primary" type="button">保存答题设置</button>
        </div>
        <button id="btn-models-open" class="settings-link" type="button">
          <span class="settings-link-icon">AI</span>
          <span class="settings-link-text"><strong>模型管理</strong><small id="settings-model-summary">尚未配置模型</small></span>
          <span class="settings-chevron">›</span>
        </button>
      </div>
    </section>

    <section id="view-models" class="view settings-view" hidden aria-label="模型管理">
      <div class="settings-header">
        <button class="btn-icon settings-back" id="btn-models-back" type="button" title="返回总体设置" aria-label="返回总体设置">←</button>
        <h2>模型管理</h2>
        <button class="btn-text" id="btn-ai-profile-new" type="button">＋ 添加</button>
      </div>
      <div class="settings-content">
        <p class="settings-caption">选择一个模型作为当前答题模型，或进入编辑页修改配置。</p>
        <div id="ai-profile-list" class="profile-list"></div>
      </div>
    </section>

    <section id="view-model-editor" class="view settings-view" hidden aria-label="编辑模型">
      <div class="settings-header">
        <button class="btn-icon settings-back" id="btn-model-editor-back" type="button" title="返回模型管理" aria-label="返回模型管理">←</button>
        <h2 id="model-editor-title">添加模型</h2>
      </div>
      <div class="settings-content model-fields">
        <div class="form-group">
          <label for="ai-profile-name">显示名称</label>
          <input id="ai-profile-name" class="form-control" type="text" placeholder="如：常用模型">
        </div>
        <div class="form-group">
          <label for="ai-base-url">API 地址</label>
          <input id="ai-base-url" class="form-control" type="url" placeholder="https://api.example.com/v1">
        </div>
        <div class="form-group">
          <label for="ai-api-key">API 密钥</label>
          <div class="inline-row">
            <input id="ai-api-key" class="form-control" type="password" autocomplete="off" placeholder="API Key">
            <button id="btn-key-visibility" class="btn-icon field-icon" type="button" title="显示密钥" aria-label="显示密钥">显示</button>
          </div>
        </div>
        <div class="form-group">
          <label for="ai-model-id">模型 ID</label>
          <input id="ai-model-id" class="form-control" type="text" placeholder="model-id">
        </div>
        <div class="form-group">
          <label for="ai-api-type">接口协议</label>
          <select id="ai-api-type" class="form-control">
            <option value="chat_completions">Chat Completions</option>
            <option value="responses">Responses</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ai-api-path">接口路径</label>
          <input id="ai-api-path" class="form-control" type="text" placeholder="/chat/completions">
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="ai-reasoning-effort">默认思考等级</label>
            <select id="ai-reasoning-effort" class="form-control">
              <option value="">模型默认</option><option value="none">不思考</option>
              <option value="low">Low</option><option value="medium">Medium</option>
              <option value="high">High</option><option value="xhigh">XHigh</option><option value="max">Max</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ai-temperature">温度</label>
            <input id="ai-temperature" class="form-control" type="number" min="0" max="2" step="0.1" placeholder="默认">
          </div>
        </div>
        <p class="settings-caption">设置思考等级时不发送温度参数。保存不会调用模型；测试连接可能产生费用。</p>
        <p id="model-editor-error" class="field-error" role="alert" hidden></p>
        <p id="model-editor-status" class="field-status" role="status" hidden></p>
      </div>
      <div class="editor-actions">
        <button class="btn btn-outline btn-danger" id="btn-ai-config-delete" type="button">删除</button>
        <button class="btn btn-outline" id="btn-ai-config-test" type="button">测试连接</button>
        <button class="btn btn-primary" id="btn-ai-config-save" type="button">保存</button>
      </div>
    </section>
  </div>

  <script src="modules/ai-answer/config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
